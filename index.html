<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <div class="header-bloc">
        <div class="header-logo">
          <img src="img/img_header/logo_header.svg" alt="FitMaker" />
          <button>
            <img src="img/img_header/search_header.svg" alt="seacrh" />
          </button>
        </div>
        <nav class="header-nav">
          <a href="#">Home</a>
          <a href="#">Programs</a>
          <a href="#">Coaching</a>
          <a href="#">Membership</a>
          <a href="#">About Us</a>
        </nav>
        <div class="header-login-btn">
          <a class="btn-header btn-orange" href="#">Login</a>
          <a class="btn-header btn-red" href="#">Sign Up</a>
        </div>
      </div>
    </header>
    <section class="cta">
      <div class="cta-bloc">
        <div class="cta-left">
          <div class="cta-titel">
            <img src="img/img_cta/titel_cta.svg" alt="Achive Your" />
          </div>
          <div class="cta-text">
            <p>
              "Join the Fitmaker community and transform your fitness journey.
              Our expert coaches and personalized programs are designed to help
              you achieve your goals and exceed your expectations. Ready to make
              a change?"
            </p>
          </div>
          <div class="cta-btns">
            <button class="cta-btn btn-orange">Start Your Journey</button>
            <button class="cta-btn btn-red">Explore Programs</button>
          </div>
        </div>
        <div class="cta-rights">
          <img src="img/img_cta/img_cta.png" alt="men" />
        </div>
      </div>
    </section>
    <section class="Our-Website">
      <img src="/img/Our-Website.svg" alt="Our-Website" />
    </section>
    <section class="services">
      <div class="services-bloc">
        <h1></h1>
        <p></p>
        <div class="services-conteiner">
          <img
            src="/img/img_services/services-img-1.png"
            alt="Losing Weight "
          />
          <img
            src="/img/img_services/services-img-2.png"
            alt="Bulding Muscel"
          />
          <img
            src="/img/img_services/services-img-3.png"
            alt="Traing in Home"
          />
          <img src="/img/img_services/services-img-4.png" alt="Gym plan" />
        </div>
      </div>
    </section>
  </body>
</html>
